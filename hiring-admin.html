<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiring Admin — Dong Shan Construction</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#f5f5f0;color:#1b1b1b;min-height:100vh}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a0700 0%,#2a1200 40%,#EA5501 72%,#1a0700 100%)}
.login-box{background:#fff;padding:52px 44px;width:100%;max-width:420px;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,0.4)}
.login-logo{font-family:'Oswald',sans-serif;font-size:2rem;font-weight:700;color:#EA5501;letter-spacing:1px}
.login-sub{font-size:0.72rem;color:#aaa;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:36px;margin-top:4px}
.login-label{font-size:0.78rem;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:1px;text-align:left;display:block;margin-bottom:6px}
.login-box input[type=password]{width:100%;border:1.5px solid #e0e0e0;padding:13px 16px;font-size:0.9rem;font-family:'Poppins',sans-serif;outline:none;transition:border 0.2s;margin-bottom:20px}
.login-box input[type=password]:focus{border-color:#EA5501}
.login-btn{width:100%;background:#EA5501;color:#fff;border:none;padding:14px;font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;letter-spacing:1.5px;cursor:pointer;transition:background 0.2s}
.login-btn:hover{background:#c44800}
.login-error{color:#c44800;font-size:0.82rem;margin-top:12px;display:none;text-align:center}

/* DASHBOARD */
#dashboard{display:none;min-height:100vh}
.dash-nav{background:linear-gradient(135deg,#1a0700 0%,#2a1200 40%,#EA5501 72%,#1a0700 100%);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px}
.dash-logo{font-family:'Oswald',sans-serif;font-size:1.25rem;font-weight:700;color:#fff;letter-spacing:0.5px}
.dash-logo em{color:#ffcfaf;font-style:normal}
.dash-actions{display:flex;align-items:center;gap:16px}
.dash-actions span{color:rgba(255,255,255,0.7);font-size:0.82rem}
.logout-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:7px 18px;font-size:0.8rem;font-family:'Poppins',sans-serif;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px}
.logout-btn:hover{background:rgba(255,255,255,0.2)}

.dash-body{max-width:1100px;margin:40px auto;padding:0 24px 60px}
.dash-head-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.dash-title{font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:700;color:#1b1b1b}
.dash-desc{font-size:0.83rem;color:#888;margin-top:4px}
.add-btn{background:#EA5501;color:#fff;border:none;padding:12px 26px;font-family:'Oswald',sans-serif;font-size:0.95rem;font-weight:600;letter-spacing:0.5px;cursor:pointer;transition:background 0.2s;white-space:nowrap}
.add-btn:hover{background:#c44800}

/* TABLE */
.tbl-wrap{background:#fff;box-shadow:0 2px 16px rgba(0,0,0,0.07);overflow:hidden}
.jobs-table{width:100%;border-collapse:collapse}
.jobs-table th{background:#1b1b1b;color:#fff;padding:13px 18px;text-align:left;font-family:'Oswald',sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.jobs-table td{padding:15px 18px;border-bottom:1px solid #f0ece8;font-size:0.86rem;vertical-align:middle}
.jobs-table tr:last-child td{border-bottom:none}
.jobs-table tr:hover td{background:#fff9f6}
.j-title{font-weight:600;color:#1b1b1b}
.j-meta{font-size:0.78rem;color:#aaa;margin-top:3px}
.badge{display:inline-block;padding:3px 10px;font-size:0.7rem;font-weight:600;letter-spacing:0.5px;border-radius:2px}
.badge-on{background:#d1fae5;color:#065f46}
.badge-off{background:#fee2e2;color:#991b1b}
.tbl-btn{border:none;padding:6px 14px;font-size:0.77rem;font-family:'Poppins',sans-serif;cursor:pointer;margin-right:5px;transition:all 0.15s;font-weight:500}
.btn-edit{background:#EA5501;color:#fff}
.btn-edit:hover{background:#c44800}
.btn-toggle{background:#f0ede8;color:#555}
.btn-toggle:hover{background:#e0dcd6}
.btn-del{background:#fee2e2;color:#991b1b}
.btn-del:hover{background:#fecaca}
.empty-row td{text-align:center;padding:48px;color:#bbb;font-size:0.88rem}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;width:100%;max-width:560px;padding:40px 36px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,0.25)}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#ccc;line-height:1}
.modal-close:hover{color:#1b1b1b}
.modal-title{font-family:'Oswald',sans-serif;font-size:1.35rem;font-weight:700;margin-bottom:28px;color:#1b1b1b}
.f-label{font-size:0.75rem;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:0.8px;display:block;margin-bottom:6px}
.f-input{width:100%;border:1.5px solid #e0e0e0;padding:11px 14px;font-size:0.88rem;font-family:'Poppins',sans-serif;outline:none;transition:border 0.2s;margin-bottom:18px}
.f-input:focus{border-color:#EA5501}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-row .f-input{margin-bottom:0}
.f-row-wrap{margin-bottom:18px}
.modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:6px;padding-top:20px;border-top:1px solid #f0f0f0}
.btn-cancel{background:#f5f5f0;color:#555;border:none;padding:10px 22px;font-family:'Poppins',sans-serif;font-size:0.87rem;cursor:pointer}
.btn-cancel:hover{background:#ebe8e0}
.btn-save{background:#EA5501;color:#fff;border:none;padding:11px 28px;font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;letter-spacing:0.5px}
.btn-save:hover{background:#c44800}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;padding:13px 22px;font-size:0.85rem;z-index:200;transform:translateY(80px);opacity:0;transition:all 0.3s;font-weight:500}
.toast.show{transform:translateY(0);opacity:1}
.toast-ok{background:#065f46;color:#fff}
.toast-err{background:#991b1b;color:#fff}

/* STATS BAR */
.stats-bar{display:flex;gap:20px;margin-bottom:28px}
.stat-card{background:#fff;padding:18px 24px;flex:1;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.stat-num{font-family:'Oswald',sans-serif;font-size:2rem;font-weight:700;color:#EA5501}
.stat-lbl{font-size:0.78rem;color:#aaa;margin-top:2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">DONG SHAN</div>
    <div class="login-sub">Hiring Admin Panel</div>
    <label class="login-label" for="pwd">Admin Password</label>
    <input type="password" id="pwd" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">LOGIN</button>
    <div class="login-error" id="login-err">Wrong password. Please try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav class="dash-nav">
    <div class="dash-logo">DONG SHAN <em>— Hiring Admin</em></div>
    <div class="dash-actions">
      <span>Admin</span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </nav>
  <div class="dash-body">
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">Total Jobs</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-active">0</div><div class="stat-lbl">Active / Visible</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-hidden">0</div><div class="stat-lbl">Hidden</div></div>
    </div>
    <div class="dash-head-row">
      <div>
        <div class="dash-title">Job Listings</div>
        <div class="dash-desc">Changes save instantly and reflect live on the website.</div>
      </div>
      <button class="add-btn" onclick="openModal()">+ Add New Job</button>
    </div>
    <div class="tbl-wrap">
      <table class="jobs-table">
        <thead>
          <tr>
            <th>Job Title</th>
            <th>Dept / Type</th>
            <th>Location</th>
            <th>Salary</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobs-tbody">
          <tr class="empty-row"><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#215;</button>
    <div class="modal-title" id="modal-title">Add New Job</div>
    <label class="f-label">Job Title *</label>
    <input class="f-input" type="text" id="f-title" placeholder="e.g. Senior Site Engineer — Interior">
    <div class="f-row f-row-wrap">
      <div>
        <label class="f-label">Department</label>
        <input class="f-input" type="text" id="f-dept" placeholder="e.g. Civil / Interior">
      </div>
      <div>
        <label class="f-label">Employment Type</label>
        <select class="f-input" id="f-type">
          <option>Full-Time</option>
          <option>Part-Time</option>
          <option>Contract</option>
          <option>Internship</option>
        </select>
      </div>
    </div>
    <div class="f-row f-row-wrap">
      <div>
        <label class="f-label">Location</label>
        <input class="f-input" type="text" id="f-location" placeholder="e.g. Noida / Pune">
      </div>
      <div>
        <label class="f-label">Salary</label>
        <input class="f-input" type="text" id="f-salary" placeholder="e.g. &#8377;8&#8211;14 LPA">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveJob()">SAVE JOB</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let token = localStorage.getItem('ds_admin_token') || '';
let jobs = [];
let editingId = null;

if (token) showDashboard();

async function doLogin() {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  if (!pwd) return;
  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    });
    const data = await res.json();
    if (!res.ok) { err.style.display = 'block'; return; }
    token = data.token;
    localStorage.setItem('ds_admin_token', token);
    showDashboard();
  } catch (e) {
    err.textContent = 'Server error. Try again.';
    err.style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('ds_admin_token');
  token = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd').value = '';
}

async function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  await loadJobs();
}

async function loadJobs() {
  try {
    const res = await fetch('/api/jobs-admin', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (res.status === 401) { doLogout(); return; }
    jobs = await res.json();
    renderJobs();
  } catch (e) {
    showToast('Failed to load jobs', 'err');
  }
}

function renderJobs() {
  const active = jobs.filter(j => j.active !== false).length;
  const hidden = jobs.length - active;
  document.getElementById('stat-total').textContent = jobs.length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-hidden').textContent = hidden;

  const tbody = document.getElementById('jobs-tbody');
  if (!jobs.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No jobs yet. Click "+ Add New Job" to start.</td></tr>';
    return;
  }
  tbody.innerHTML = jobs.map(j => `
    <tr>
      <td><div class="j-title">${esc(j.title)}</div></td>
      <td><div class="j-meta">${esc(j.dept || '—')} &nbsp;·&nbsp; ${esc(j.type || 'Full-Time')}</div></td>
      <td>${esc(j.location || '—')}</td>
      <td>${esc(j.salary || '—')}</td>
      <td><span class="badge ${j.active !== false ? 'badge-on' : 'badge-off'}">${j.active !== false ? 'Visible' : 'Hidden'}</span></td>
      <td>
        <button class="tbl-btn btn-edit" onclick="openModal('${esc(j.id)}')">Edit</button>
        <button class="tbl-btn btn-toggle" onclick="toggleJob('${esc(j.id)}')">${j.active !== false ? 'Hide' : 'Show'}</button>
        <button class="tbl-btn btn-del" onclick="deleteJob('${esc(j.id)}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modal-title').textContent = id ? 'Edit Job' : 'Add New Job';
  if (id) {
    const j = jobs.find(x => x.id === id);
    if (j) {
      document.getElementById('f-title').value = j.title || '';
      document.getElementById('f-dept').value = j.dept || '';
      document.getElementById('f-type').value = j.type || 'Full-Time';
      document.getElementById('f-location').value = j.location || '';
      document.getElementById('f-salary').value = j.salary || '';
    }
  } else {
    ['f-title','f-dept','f-location','f-salary'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-type').value = 'Full-Time';
  }
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 50);
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
  editingId = null;
}

async function saveJob() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('Job title is required', 'err'); return; }
  const jobData = {
    id: editingId || Date.now().toString(),
    title,
    dept: document.getElementById('f-dept').value.trim(),
    type: document.getElementById('f-type').value,
    location: document.getElementById('f-location').value.trim(),
    salary: document.getElementById('f-salary').value.trim(),
    active: true,
  };
  if (editingId) {
    jobs = jobs.map(j => j.id === editingId ? { ...j, ...jobData, active: j.active } : j);
  } else {
    jobs = [...jobs, jobData];
  }
  await persistJobs();
  closeModal();
}

async function toggleJob(id) {
  jobs = jobs.map(j => j.id === id ? { ...j, active: j.active === false } : j);
  await persistJobs();
}

async function deleteJob(id) {
  if (!confirm('Delete this job? This cannot be undone.')) return;
  jobs = jobs.filter(j => j.id !== id);
  await persistJobs();
}

async function persistJobs() {
  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(jobs),
    });
    if (res.status === 401) { showToast('Session expired. Please login again.', 'err'); doLogout(); return; }
    renderJobs();
    showToast('Saved! Website updated.', 'ok');
  } catch (e) {
    showToast('Save failed. Check connection.', 'err');
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show toast-' + (type || 'ok');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

document.getElementById('modal-bg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
